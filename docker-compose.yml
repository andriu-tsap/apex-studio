services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apex-local-demo}
      POSTGRES_DB: apex
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apex']
      interval: 3s
      timeout: 3s
      retries: 20
  py-service:
    build: ./apps/py-service
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-demo-service-token}
      CORS_ORIGINS: http://localhost:3000
    ports: ['127.0.0.1:8001:8001']
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://apex:${POSTGRES_PASSWORD:-apex-local-demo}@postgres:5432/apex
      PYTHON_URL: http://py-service:8001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-demo-service-token}
      CORS_ORIGINS: http://localhost:3000,http://localhost:4200
      WEB_URL: http://localhost:3000
      COOKIE_SECURE: 'false'
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      py-service: { condition: service_started }
    ports: ['127.0.0.1:4000:4000']
  web:
    build: { context: ., target: web }
    ports: ['127.0.0.1:3000:80']
    depends_on: [api]
  admin:
    build: { context: ., target: admin }
    ports: ['127.0.0.1:4200:80']
    depends_on: [api]
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:-apex-wp-local-demo}
      MARIADB_ROOT_PASSWORD: ${WP_ROOT_PASSWORD:-apex-wp-root-local-demo}
    volumes: ['wordpress_db:/var/lib/mysql']
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:6-php8.3-apache
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-apex-wp-local-demo}
      WORDPRESS_DB_NAME: wordpress
    ports: ['127.0.0.1:8080:80']
    volumes:
      - wordpress_files:/var/www/html
      - ./apps/wp-plugin:/var/www/html/wp-content/plugins/apex-realizacje:ro
    depends_on:
      mariadb: { condition: service_healthy }
  wp-setup:
    image: wordpress:cli-php8.3
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-apex-wp-local-demo}
      WORDPRESS_DB_NAME: wordpress
      WP_DEMO_PASSWORD: ${WP_DEMO_PASSWORD:-ApexDemo2026!}
    volumes:
      - wordpress_files:/var/www/html
      - ./apps/wp-plugin:/var/www/html/wp-content/plugins/apex-realizacje:ro
    depends_on: [wordpress]
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until [ -f /var/www/html/wp-config.php ]; do sleep 2; done
        until wp db check --quiet; do sleep 2; done
        wp core is-installed || wp core install --url=http://localhost:8080 --title='APEX Concept / demo' --admin_user=apex-demo --admin_password="$$WP_DEMO_PASSWORD" --admin_email=demo@example.invalid --skip-email
        wp option update permalink_structure '/%postname%/'
        wp plugin activate apex-realizacje
        wp eval-file wp-content/plugins/apex-realizacje/seed.php
        wp rewrite flush --hard
volumes:
  postgres_data:
  wordpress_db:
  wordpress_files:
