packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
minimumReleaseAgeExclude:
  - playwright-core@1.65.1
onlyBuiltDependencies:
  - 'msgpackr-extract'
  - 'lmdb'
  - 'prisma'
  - '@prisma/engines'
  - '@prisma/client'
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild

ignoredBuiltDependencies:
  - '@scarf/scarf'
  - core-js
